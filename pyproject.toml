[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ocr-agentic-rag"
version = "1.0.0"
description = "Production-grade Distributed OCR + RAG + Multi-Agent AI System"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Engineering Team" }
]
dependencies = [
    # API & Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Database & Migrations
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",

    # Queue & Async Processing
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Object Storage
    "minio>=7.2.0",

    # Vector Store & Search
    "pymilvus>=2.4.0",
    "rank-bm25>=0.2.2",

    # Embeddings & Reranking
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",

    # OCR & Computer Vision
    "PyMuPDF>=1.24.0",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=3.0.0; sys_platform == 'win32'",

    # Document Parsers
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.6",
    "striprtf>=0.0.26",
    "defusedxml>=0.7.1",

    # Agentic AI & LLM
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "groq>=0.9.0",
    "duckduckgo-search>=6.2.0",

    # Frontend
    "streamlit>=1.38.0",

    # Reliability & Circuit Breaker
    "pybreaker>=1.2.0",
    "tenacity>=8.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "flake8>=7.1.0",
    "mypy>=1.11.0",
    "jiwer>=3.0.4"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | data
  | artifacts
)/
'''

[tool.isort]
profile = "black"
line_length = 100
